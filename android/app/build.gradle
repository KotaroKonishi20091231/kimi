plugins {
    id 'com.android.application'
}

android {
    namespace 'com.kimi.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.kimi.app'
        minSdk 26
        targetSdk 34
        // CI の実行番号をバージョンにして、上書きインストールできるようにする
        versionCode = Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1')
        versionName = "1." + (System.getenv('GITHUB_RUN_NUMBER') ?: '0')
    }

    signingConfigs {
        kimi {
            storeFile file('../kimi.keystore')
            storePassword 'kimikimi'
            keyAlias 'kimi'
            keyPassword 'kimikimi'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.kimi
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // 写真の文字読み取り（日本語）と、写っているものの判定。どちらもスマホの中で動く
    implementation 'com.google.mlkit:text-recognition-japanese:16.0.1'
    implementation 'com.google.mlkit:image-labeling:17.0.9'
}
